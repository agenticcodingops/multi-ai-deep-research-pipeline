# Stamped from the shared dependency-update template; see docs/DEPENDENCY-UPDATES.md.
version: 2
updates:
  # PER REPO: repeat this entry for every ecosystem + manifest directory.
  # Dependabot does not recurse. Keep the common block identical in every entry.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    # PER REPO: keep ignores last. Add any other documented bump preconditions.
    ignore:
      # Bundled CLI and review guard require manual re-measure before bumping.
      # This unconditional ignore is standard for every github-actions entry.
      - dependency-name: "anthropics/claude-code-action"
