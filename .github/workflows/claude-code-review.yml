name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          # The review reads files in this checkout, which is the pull request's head. Do not
          # leave the job token in .git/config where text in a pull request could make the
          # review print it. The action sets up its own git auth.
          persist-credentials: false

      # A pull request can carry any file, including one at the summary path the guard below
      # allows a comment to read. Remove it so the review never finds one it did not write.
      - name: Clear the review summary path
        run: rm -rf -- "$GITHUB_WORKSPACE/.review-summary.md"

      # The review plugin's frontmatter approves `gh pr comment` with any arguments, and the CLI
      # honours that grant in a non-interactive run (measured on 2.1.281, 2.1.302, 2.1.310,
      # 2.1.314 and 2.1.316, with a control command without the grant denied each time). Text in a
      # pull request can steer the review, so without a bound it could comment on another pull
      # request, or post a file such as the checkout's git config. This workflow does not ask the
      # review to post (the prompt has no --comment, and nothing here approves a file write), but
      # the grant is there either way. A deny rule cannot narrow a grant, so this hook does. It
      # runs before every Bash and file-write call (the hook is in `settings` below) and is an
      # allow-list, not a keyword match, so no spelling of a command can get around it. A shell
      # command passes only if it is a single `gh pr view|diff|list`, `gh issue view|list` or
      # `gh search <kind>` call whose words contain nothing the shell would expand or split, and
      # no --jq, --template, -q or -t, or the exact summary comment (kept so that turning posting
      # on later needs no change here). A file write passes only for the summary file. Exit 2
      # blocks, and stderr tells the model why. The hook command adds `|| exit 2`, so a crash or
      # a missing node blocks every call. A hook that times out does not block, so a watchdog
      # armed on the script's first line blocks at 10 seconds, inside the hook's 30-second
      # timeout. The guard lives in this file, not in the checkout, because the checkout is the
      # pull request's head and must not supply code that gates the review. The test in
      # tests/test_review_comment_guard.py extracts this script, so what ships is what is tested.
      - name: Write the review comment guard
        run: |
          cat > "$RUNNER_TEMP/review-comment-guard.js" <<'GUARD'
          if (require.main === module) setTimeout(() => finish(2, "the guard timed out."), 10000);

          const path = require("path");

          // A word the shell passes through as written: no quote, backslash, #, $, backtick, ; & | < > ( )
          // { } * ? [ ] ~ ! or space in it. A # would start a shell comment and hide the quote that follows.
          const WORD = /[A-Za-z0-9_.\/:=,@%+-]+/;
          // A whole quoted word. Single quotes hold anything but a quote. Double quotes hold nothing the
          // shell would expand or escape. Nothing here can span a line, because decide() rejects them first.
          // \x5c is the backslash, written as an escape so no layer between an editor and this file can halve it.
          const QUOTED = /(?:'[^']*'|"[^"$`\x5c!]*")/;
          const ARG = WORD.source + "|" + QUOTED.source;
          const READ = new RegExp("^gh (?:pr (?:diff|view|list)|issue (?:view|list)|search [a-z]+)(?: (?:" + ARG + "))*$");
          const WORDS = new RegExp("(?<= )(?:" + ARG + ")(?= |$)", "g");
          // gh's --jq and --template can read environment variables, and -q and -t are their short forms.
          const FILTER = /^(?:--(?:jq|template)(?:=|$)|-(?!-)[A-Za-z]*[qt])/;
          const FILE_TOOLS = ["Write", "Edit", "MultiEdit", "NotebookEdit"];

          // Returns null to let the call go on to the normal permission check, or the reason to block it.
          function decide(tool, input, ctx) {
            const file = ctx.ws + "/.review-summary.md";
            if (FILE_TOOLS.includes(tool)) {
              // Every path field that is present must be the summary file, and there must be at least one.
              const targets = [input.file_path, input.notebook_path].filter((p) => p !== undefined);
              const ok = targets.length > 0 && targets.every((p) => typeof p === "string" && path.resolve(p) === path.resolve(file));
              return ok ? null : "the only file the review may write is " + file + ".";
            }
            if (tool !== "Bash") return null;

            const command = input.command;
            if (typeof command !== "string") return "a Bash call without a command.";
            const comments = [
              "gh pr comment " + ctx.pr + " --repo " + ctx.repo + " --body-file " + file,
              "gh pr comment " + ctx.pr + " --body-file " + file,
              "gh pr comment https://github.com/" + ctx.repo + "/pull/" + ctx.pr + " --body-file " + file,
            ];
            if (comments.includes(command)) return null;
            // One line, and no control character, so a quoted string cannot hide a second command.
            if (!/[\x00-\x1f\x7f]/.test(command) && READ.test(command)) {
              for (const word of command.match(WORDS) || []) {
                if (FILTER.test(word.replace(/^(['"])(.*)\1$/, "$2"))) {
                  return "gh read calls may not use --jq, --template, -q or -t.";
                }
              }
              return null;
            }
            return "the only shell commands allowed are single gh calls with plain arguments: `gh pr view|diff|list`, " +
              "`gh issue view|list` and `gh search <kind>` (quote a search phrase as a whole word, with no $, backtick, " +
              "backslash or !; no #, pipes, redirects, heredocs, substitutions or line breaks), and the summary comment, " +
              "exactly `" + comments[0] + "`.";
          }

          function finish(code, why) {
            if (why) process.stderr.write("Blocked: " + why + "\n");
            process.exit(code);
          }

          if (require.main === module) {
            const [pr, repo, ws] = process.argv.slice(2);
            if (!/^[0-9]+$/.test(pr || "") || !/^[\w.-]+\/[\w.-]+$/.test(repo || "") || !ws) {
              finish(2, "the guard was started without its arguments.");
            }
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              let event;
              try {
                event = JSON.parse(raw);
              } catch (e) {
                finish(2, "the hook input could not be read.");
              }
              const why = decide(event.tool_name, event.tool_input || {}, { pr, repo, ws });
              if (why) finish(2, why);
              finish(0);
            });
          } else {
            module.exports = { decide };
          }
          GUARD
          node --check "$RUNNER_TEMP/review-comment-guard.js"

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to a commit, because a tag can be moved and this job holds the OAuth secret.
        # Re-measure before bumping this pin, and before loosening the guard step above: the
        # plugin's `gh pr comment` grant is honoured on every CLI version measured, so the
        # boundary rests on that guard.
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action merges this into ~/.claude/settings.json before it installs the plugin.
          # It carries the comment guard written above, as a PreToolUse hook.
          settings: |
            {
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "Bash|Write|Edit|MultiEdit|NotebookEdit",
                    "hooks": [
                      {
                        "type": "command",
                        "timeout": 30,
                        "command": "node '${{ runner.temp }}/review-comment-guard.js' ${{ github.event.pull_request.number }} ${{ github.repository }} '${{ github.workspace }}' || exit 2"
                      }
                    ]
                  }
                ]
              }
            }
          # The action's own token is in GH_TOKEN while the review runs, so text in a PR could
          # make the review disclose it. The action asks for contents: write by default; the
          # review never pushes, so ask for read and a leaked token cannot push code.
          additional_permissions: |
            contents: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # No --comment: the plugin reviews and posts nothing, by design. Turning posting on is a
          # separate change: add the flag, an Edit rule for the summary file in --allowedTools, and
          # the exact `gh pr comment` rules the guard already allows (see the sibling repositories'
          # review workflows), and give the job pull-requests: write.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Deny the file tools the guard script, the settings that install it, and .git. An Edit
          # rule covers the Write tool; a Write(path) rule is never matched. gh's --jq filter can
          # read environment variables, so the gh read commands may not use --jq or --template.
          claude_args: |
            --disallowedTools "Read(./.git/**),Edit(/${{ runner.temp }}/**),Edit(~/.claude/**),Edit(/${{ github.workspace }}/.git/**),Bash(gh * --jq*),Bash(gh * -q*),Bash(gh * --template*),Bash(gh * -t*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
