name: Commit hygiene

# Server-side enforcement of the authorship policy in AGENTS.md.
# Local hooks can be skipped with --no-verify; this check cannot.
# It checks only that no AI assistant is a commit author, committer or
# co-author, and that the PR body carries no AI attribution line.

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: No AI assistant as commit author or co-author
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the guard
        run: python3 -I tests/test_branding_guard.py -v

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_HEAD"
          fi
          # A new branch, a force push whose old tip is not in this clone, and
          # the default branch itself are handled in commit_range (see the guard).
          . ./.githooks/branding-guard.sh
          list=$(commit_range "$base" "$head" "origin/$DEFAULT_BRANCH") || {
            echo "::error::Could not list the commits to check."; exit 1; }
          list=$(printf '%s' "$list" | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Check commit authors, committers and co-authors
        env:
          COMMITS: ${{ steps.range.outputs.list }}
        run: |
          . ./.githooks/branding-guard.sh
          fail=0
          for c in $COMMITS; do
            short=$(git rev-parse --short "$c")
            git log -1 --format='%B' "$c" | coauthor_check "commit $short" || fail=1
            identity_check "$(git log -1 --format='%an <%ae>' "$c")" "author"    "$short" || fail=1
            identity_check "$(git log -1 --format='%cn <%ce>' "$c")" "committer" "$short" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::An AI assistant is a commit author, committer or co-author. See AGENTS.md."
            exit 1
          fi
          echo "No scanned commit names an AI assistant as a contributor."

      - name: Check the PR body for AI attribution lines
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          . ./.githooks/branding-guard.sh
          printf '%s\n' "$PR_BODY" | attribution_scan "PR body" \
            || { echo "::error::The PR body carries an AI attribution line. See AGENTS.md."; exit 1; }
